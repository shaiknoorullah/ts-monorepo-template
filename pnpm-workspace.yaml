packages:
  - apps/*
  # Covers @ts-monorepo-template/contracts (packages/contracts) — the cross-language
  # proto package with buf-generated TS bindings consumed by downstream apps.
  - packages/*
  - internal/*
  - infra/cloudflare/workers/*
  - docs
  # Schema-validation tests for the hand-maintained cloud-prices/*.yaml tables
  # consumed by @internal/cost-simulator.
  - data/cloud-prices/__tests__

catalog:
  '@opentelemetry/api': ^1.10.0
  '@types/node': ^22.10.0
  '@vitest/coverage-v8': ^4.0.0
  '@vitest/ui': ^4.0.0
  pino: ^9.7.0
  tsdown: ^0.22.0
  tsx: ^4.20.0
  typescript: ^5.7.0
  vitest: ^4.0.0
  zod: ^4.0.0

catalogs:
  runtime:
    '@fastify/cors': ^11.0.0
    '@fastify/helmet': ^13.0.0
    bullmq: ^5.30.0
    drizzle-orm: ^0.40.0
    fastify: ^5.0.0
    ioredis: ^5.4.0
  testing:
    '@faker-js/faker': ^10.0.0
    '@testcontainers/postgresql': ^11.0.0
    msw: ^2.10.0
