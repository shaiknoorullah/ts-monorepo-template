# pnpm workspaces — see https://pnpm.io/pnpm-workspace_yaml
packages:
  - "apps/*"
  - "packages/*"
  - "internal/*"
  - "infra/cloudflare/workers/*"
  - "docs"

# Catalog: cluster-wide version pinning.
# Reference from any package via "catalog:" — pnpm 10.12.1+ resolves to the version below.
# See https://pnpm.io/catalogs
catalog:
  typescript: ^5.7.0
  tsx: ^4.20.0
  tsdown: ^0.6.0
  vitest: ^4.0.0
  "@vitest/coverage-v8": ^4.0.0
  "@vitest/ui": ^4.0.0
  zod: ^4.0.0
  pino: ^9.7.0
  "@opentelemetry/api": ^1.10.0
  "@types/node": ^22.10.0

catalogs:
  # Pinned-exact group for "everything that must agree across services"
  runtime:
    fastify: ^5.0.0
    "@fastify/cors": ^11.0.0
    "@fastify/helmet": ^13.0.0
    drizzle-orm: ^0.40.0
    bullmq: ^5.30.0
    ioredis: ^5.4.0
  testing:
    "@testcontainers/postgresql": ^11.0.0
    msw: ^2.10.0
    "@faker-js/faker": ^10.0.0
