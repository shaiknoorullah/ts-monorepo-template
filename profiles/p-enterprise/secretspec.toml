[profile]
id = "p-enterprise"

[backend]
backend = "vault"
address = "https://vault.platform.local"
role = "backend-default"

[secrets.required]
VAULT_TOKEN = "Vault bootstrap token (rotated every 24h)"
HARBOR_USERNAME = "Harbor robot account"
HARBOR_PASSWORD = "Harbor robot password"
DATABASE_URL = "Postgres HA primary"
KAFKA_BOOTSTRAP = "Kafka bootstrap"

[secrets.optional]
PAGERDUTY_TOKEN = "PD integration"
SPLUNK_TOKEN = "Audit log forwarder"
