image:
  registry: harbor.local
  repository: ts-monorepo-template/py-hello
replicas: 5
resources:
  requests:
    cpu: 1000m
    memory: 512Mi
  limits:
    cpu: 4000m
    memory: 2048Mi
autoscaling:
  enabled: true
  minReplicas: 5
  maxReplicas: 50
podDisruptionBudget:
  enabled: true
  minAvailable: 3
monitoring:
  enabled: true
mesh:
  enabled: true
  type: istio
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/region
    whenUnsatisfiable: ScheduleAnyway
