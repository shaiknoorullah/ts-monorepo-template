[profile]
id = "p-startup-scale"

[backend]
backend = "akv"
vault_url = "https://pn-akv-ap-south-1.vault.azure.net/"

[secrets.required]
AZURE_TENANT_ID = "Entra tenant"
AZURE_CLIENT_ID = "Workload identity SP"
ACR_LOGIN_SERVER = "Azure Container Registry"
CLOUDFLARE_API_TOKEN = "Cloudflare DNS"
DATABASE_URL = "Postgres primary"
KAFKA_BOOTSTRAP = "Kafka bootstrap servers"

[secrets.optional]
PAGERDUTY_TOKEN = "PD integration"
SLACK_WEBHOOK_URL = "Notifications"
