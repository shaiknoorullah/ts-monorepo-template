image:
  registry: acr.io
  repository: ts-monorepo-template/go-hello
replicas: 3
resources:
  requests:
    cpu: 250m
    memory: 128Mi
  limits:
    cpu: 2000m
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
podDisruptionBudget:
  enabled: true
  minAvailable: 2
monitoring:
  enabled: true
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
