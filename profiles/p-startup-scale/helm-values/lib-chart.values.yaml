image:
  registry: acr.io
  repository: ts-monorepo-template/lib-chart
  digest: ''
secrets:
  backend: akv
  refreshInterval: 30m
  akv:
    vaultUrl: https://pn-akv-ap-south-1.vault.azure.net/
networkPolicy:
  defaultDeny: true
replicas: 3
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
podDisruptionBudget:
  enabled: true
  minAvailable: 2
monitoring:
  enabled: true
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
