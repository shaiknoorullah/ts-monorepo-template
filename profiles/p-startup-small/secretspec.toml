[profile]
id = "p-startup-small"

[backend]
backend = "akv"
vault_url = "https://pn-akv-ap-south-1.vault.azure.net/"

[secrets.required]
AZURE_TENANT_ID = "Entra tenant"
AZURE_CLIENT_ID = "SP for ESO workload identity"
GITHUB_TOKEN = "ghcr.io pulls"
CLOUDFLARE_API_TOKEN = "Cloudflare DNS"
DATABASE_URL = "Postgres connection string"

[secrets.optional]
SLACK_WEBHOOK_URL = "Notifications"
