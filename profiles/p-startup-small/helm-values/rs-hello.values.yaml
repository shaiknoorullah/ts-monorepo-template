image:
  registry: ghcr.io
  repository: ts-monorepo-template/rs-hello
replicas: 2
resources:
  requests:
    cpu: 100m
    memory: 32Mi
  limits:
    cpu: 1000m
    memory: 192Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
podDisruptionBudget:
  enabled: true
  minAvailable: 1
monitoring:
  enabled: true
