image:
  registry: ghcr.io
  repository: ts-monorepo-template/py-hello
replicas: 2
resources:
  requests:
    cpu: 200m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
podDisruptionBudget:
  enabled: true
  minAvailable: 1
monitoring:
  enabled: true
