apiVersion: pn.cloud/v1alpha1
kind: KeycloakClientClaim
metadata:
  name: go-hello
  namespace: prod
  labels:
    app.kubernetes.io/name: go-hello
    app.kubernetes.io/component: identity
spec:
  env: prod
  realm: platform
  clientId: go-hello-prod
  redirectUris:
    - https://go-hello.pn.cloud/callback
  scopes:
    - openid
    - profile
    - email
  groupMappers:
    - { group: platform-users, claim: groups }
  serviceAccount:
    enabled: false
    roles: []
  connectionSecret: go-hello-oidc-conn
  compositionSelector:
    matchLabels:
      pn.cloud/variant: default
