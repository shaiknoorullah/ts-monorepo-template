apiVersion: pn.cloud/v1alpha1
kind: RedisClusterClaim
metadata:
  name: py-hello
  namespace: prod
  labels:
    app.kubernetes.io/name: py-hello
    app.kubernetes.io/component: redis
spec:
  env: prod
  size: m
  tls: true
  persistence: true
  connectionSecret: py-hello-redis-conn
  compositionSelector:
    matchLabels:
      pn.cloud/variant: small
