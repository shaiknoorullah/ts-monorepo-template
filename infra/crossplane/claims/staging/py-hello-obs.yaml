apiVersion: pn.cloud/v1alpha1
kind: ServiceObservabilityClaim
metadata:
  name: py-hello
  namespace: staging
  labels:
    app.kubernetes.io/name: py-hello
    app.kubernetes.io/component: observability
spec:
  env: staging
  selector:
    matchLabels:
      app.kubernetes.io/name: py-hello
  metricsPath: /metrics
  metricsPort: 9090
  scrapeInterval: 30s
  slos:
    - name: availability
      sli: 'sum(rate(http_requests_total{job="py-hello",status!~"5.."}[5m])) / sum(rate(http_requests_total{job="py-hello"}[5m]))'
      objective: 0.995
      window: 30d
    - name: latency-p99
      sli: 'histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job="py-hello"}[5m])) by (le))'
      objective: 0.3
      window: 30d
    - name: error-rate
      sli: 'sum(rate(http_requests_total{job="py-hello",status=~"5.."}[5m])) / sum(rate(http_requests_total{job="py-hello"}[5m]))'
      objective: 0.005
      window: 30d
  dashboardJSON:
    sourceRef:
      kind: ConfigMap
      name: py-hello-dashboard
      key: dashboard.json
  alertingTo: pager-default
  compositionSelector:
    matchLabels:
      pn.cloud/variant: default
