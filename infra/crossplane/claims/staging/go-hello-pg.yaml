apiVersion: pn.cloud/v1alpha1
kind: PostgresClusterClaim
metadata:
  name: go-hello
  namespace: staging
  labels:
    app.kubernetes.io/name: go-hello
    app.kubernetes.io/component: postgres
spec:
  env: staging
  size: s
  version: '16'
  databases:
    - { name: go_hello, owner: go_hello_app }
  pooler:
    enabled: true
    replicas: 2
    mode: transaction
  backup:
    enabled: true
    retentionDays: 7
  observability:
    prometheus: true
    dashboard: true
  connectionSecret: go-hello-pg-conn
  compositionSelector:
    matchLabels:
      pn.cloud/variant: singlenode
