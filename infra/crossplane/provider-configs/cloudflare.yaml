apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: provider-cloudflare-creds
  namespace: crossplane-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-store
    kind: ClusterSecretStore
  target:
    name: provider-cloudflare-creds
    creationPolicy: Owner
  data:
    - secretKey: api_token
      remoteRef:
        key: crossplane/cloudflare-api-token
---
apiVersion: cloudflare.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: provider-cloudflare-creds
      key: api_token
