apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: render-pg-dev
spec:
  steps:
    - try:
        - script:
            content: |
              FN_DIR=$(mktemp -d)
              cp ../../../functions/patch-and-transform.yaml \
                 ../../../functions/go-templating.yaml \
                 ../../../functions/environment-configs.yaml \
                 ../../../functions/extra-resources.yaml \
                 ../../../functions/auto-ready.yaml "$FN_DIR/"
              crossplane render \
                ./01-claim.yaml \
                ../../../compositions/core/xpostgrescluster-cnpg-singlenode.yaml \
                "$FN_DIR" \
                -e ../../../environment-configs \
                -x \
                > /tmp/render-pg-dev.yaml
              test "$(grep -c 'kind: Cluster' /tmp/render-pg-dev.yaml)" -ge 1
