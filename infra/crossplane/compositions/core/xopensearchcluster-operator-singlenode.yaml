apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xopensearchcluster-operator-singlenode
  labels:
    pn.cloud/bundle: core
    pn.cloud/variant: singlenode
spec:
  compositeTypeRef:
    apiVersion: pn.cloud/v1alpha1
    kind: XOpenSearchCluster
  mode: Pipeline
  pipeline:
    - step: load-env
      functionRef: { name: function-environment-configs }
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref: { name: env-dev }
            - type: Reference
              ref: { name: env-staging }
            - type: Reference
              ref: { name: env-prod }
    - step: render
      functionRef: { name: function-go-templating }
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $name := .observed.composite.resource.metadata.name }}
            {{- $claimRef := .observed.composite.resource.spec.claimRef }}
            {{- $ns := "default" }}
            {{- if $claimRef }}{{- $ns = $claimRef.namespace }}{{- end }}
            apiVersion: opensearch.opster.io/v1
            kind: OpenSearchCluster
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: os-cluster
                crossplane.io/external-name: {{ $name }}
              name: {{ $name }}
              namespace: {{ $ns }}
            spec:
              variant: "singlenode"
    - step: ready
      functionRef: { name: function-auto-ready }
