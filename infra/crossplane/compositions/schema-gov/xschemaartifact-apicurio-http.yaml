apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xschemaartifact-apicurio-http
  labels:
    pn.cloud/bundle: schema-gov
    pn.cloud/variant: default
spec:
  compositeTypeRef:
    apiVersion: pn.cloud/v1alpha1
    kind: XSchemaArtifact
  mode: Pipeline
  pipeline:
    - step: load-env
      functionRef: { name: function-environment-configs }
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref: { name: env-dev }
            - type: Reference
              ref: { name: env-staging }
            - type: Reference
              ref: { name: env-prod }
    - step: render
      functionRef: { name: function-go-templating }
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $name := .observed.composite.resource.metadata.name }}
            {{- $claimRef := .observed.composite.resource.spec.claimRef }}
            {{- $ns := "default" }}
            {{- if $claimRef }}{{- $ns = $claimRef.namespace }}{{- end }}
            apiVersion: http.crossplane.io/v1alpha2
            kind: Request
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: schema-artifact-req
                crossplane.io/external-name: {{ $name }}
              name: {{ $name }}
              namespace: {{ $ns }}
            spec:
              variant: "default"
    - step: ready
      functionRef: { name: function-auto-ready }
