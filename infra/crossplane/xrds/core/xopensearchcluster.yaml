apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xopensearchclusters.pn.cloud
spec:
  group: pn.cloud
  names:
    kind: XOpenSearchCluster
    plural: xopensearchclusters
  claimNames:
    kind: OpenSearchClusterClaim
    plural: opensearchclusterclaims
  defaultCompositionRef:
    name: xopensearchcluster-operator-singlenode
  connectionSecretKeys: [host, port, username, password, 'ca.crt']
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [env]
              properties:
                env: { type: string, enum: [dev, staging, prod] }
                size: { type: string, enum: [xs, s, m, l], default: s }
                masters: { type: integer }
                data: { type: integer }
                ingest: { type: integer }
                storage:
                  type: object
                  properties:
                    class: { type: string }
                    size: { type: string }
                security:
                  type: object
                  properties:
                    enabled: { type: boolean, default: true }
                    adminPassword: { type: string }
