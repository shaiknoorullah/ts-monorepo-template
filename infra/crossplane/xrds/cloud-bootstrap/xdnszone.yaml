apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xdnszones.pn.cloud
spec:
  group: pn.cloud
  names: { kind: XDNSZone, plural: xdnszones }
  claimNames: { kind: DNSZoneClaim, plural: dnszoneclaims }
  defaultCompositionRef: { name: xdnszone-cloudflare }
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [provider, zone]
              properties:
                provider: { type: string, enum: [cloudflare, route53, azuredns, clouddns] }
                zone: { type: string }
                records:
                  type: array
                  items:
                    type: object
                    required: [name, type, value]
                    properties:
                      name: { type: string }
                      type: { type: string, enum: [A, AAAA, CNAME, TXT, MX, NS, SRV] }
                      value: { type: string }
                      ttl: { type: integer, default: 300 }
                      proxied: { type: boolean, default: false }
