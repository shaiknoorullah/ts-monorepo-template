---
- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Load kernel modules
  ansible.builtin.systemd:
    name: systemd-modules-load.service
    state: restarted

- name: Restart sshd
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Restart auditd
  ansible.builtin.service:
    name: auditd
    state: restarted

- name: Restart chrony
  ansible.builtin.service:
    name: chrony
    state: restarted
