---
- name: reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: load kernel modules
  ansible.builtin.command: systemctl restart systemd-modules-load.service
  changed_when: true

- name: restart sshd
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: restart auditd
  ansible.builtin.service:
    name: auditd
    state: restarted

- name: restart chrony
  ansible.builtin.service:
    name: chrony
    state: restarted
