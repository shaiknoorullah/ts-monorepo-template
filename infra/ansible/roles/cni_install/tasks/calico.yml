---
- name: Apply Tigera operator
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig=/etc/kubernetes/admin.conf apply -f
      https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/tigera-operator.yaml
  run_once: true
  delegate_to: "{{ groups['control_plane'][0] }}"
  changed_when: true

- name: Render Calico Installation CR
  ansible.builtin.template:
    src: calico-installation.yaml.j2
    dest: /etc/kubernetes/calico-installation.yaml
    mode: '0600'
  delegate_to: "{{ groups['control_plane'][0] }}"
  run_once: true

- name: Apply Calico Installation CR
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig=/etc/kubernetes/admin.conf apply
      -f /etc/kubernetes/calico-installation.yaml
  delegate_to: "{{ groups['control_plane'][0] }}"
  run_once: true
  changed_when: true
