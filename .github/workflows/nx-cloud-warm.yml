name: nx-cloud-warm
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *'
permissions:
  contents: read
concurrency:
  group: nx-cloud-warm-${{ github.ref }}
  cancel-in-progress: false
jobs:
  warm-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN_RW }}
      NX_BRANCH: main
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22.11.0'
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: '9.15.0'
      - run: pnpm install --frozen-lockfile
      - name: Warm cache against HEAD~1
        run: pnpm exec nx affected -t build test lint type-check container --base=HEAD~1 --head=HEAD
  warm-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN_RW }}
      NX_BRANCH: main
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22.11.0'
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: '9.15.0'
      - run: pnpm install --frozen-lockfile
      - name: Warm cache against origin/main~7 (drift refresh)
        run: pnpm exec nx affected -t build test lint type-check container --base=origin/main~7 --head=HEAD
