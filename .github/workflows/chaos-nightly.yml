name: chaos-nightly
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: 'profile to chaos-test (default: p-solo)'
        required: false
        default: 'p-solo'
permissions:
  contents: read
concurrency:
  group: chaos-nightly
  cancel-in-progress: false
# Scenarios driven by tools/ci/chaos/run-pumba-scenarios.sh:
#   - pumba kill --random "re2:^go-hello-" (pod-kill scenario)
#   - pumba netem --duration 90s loss --percent 50 (network partition scenario)
jobs:
  chaos:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PROFILE: ${{ github.event.inputs.profile || 'p-solo' }}
      CHAOS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
      - uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc # v15
        with:
          name: devenv
      - run: nix profile install nixpkgs#devenv
      - name: Install k3d 5.x
        run: curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/v5.7.4/install.sh | bash
      - name: Install pumba
        run: |
          curl -fsSL -o /usr/local/bin/pumba \
            https://github.com/alexei-led/pumba/releases/download/0.11.4/pumba_linux_amd64
          chmod +x /usr/local/bin/pumba
      - name: Bringup persistent k3d cluster
        run: devenv shell -- task ci:bringup PROFILE="${PROFILE}"
      - name: Wait apps Ready
        run: devenv shell -- task ci:smoke PROFILE="${PROFILE}"
      - name: Run pumba pod-kill + netem partition scenarios
        run: bash tools/ci/chaos/run-pumba-scenarios.sh ".ci/evidence/${PROFILE}/chaos/chaos-report.json"
      - if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: chaos-report-${{ env.PROFILE }}-${{ github.run_id }}
          path: .ci/evidence/${{ env.PROFILE }}/chaos/chaos-report.json
          retention-days: 30
      - if: always()
        name: Teardown
        run: devenv shell -- task ci:teardown PROFILE="${PROFILE}"
