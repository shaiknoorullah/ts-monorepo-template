name: xp-claims
on:
  pull_request:
    paths:
      - 'infra/crossplane/claims/**'
      - 'infra/crossplane/xrds/**'
      - 'infra/crossplane/compositions/**'
      - 'infra/crossplane/functions/**'
      - 'infra/crossplane/environment-configs/**'
      - '.github/workflows/xp-claims.yml'
  workflow_call: {}

permissions:
  contents: read

jobs:
  xp-claims:
    name: Crossplane claim parse + render
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq (mikefarah v4)
        # `mikefarah/yq-action` does not exist as a repo — pull the static
        # binary directly from a pinned release. yq itself is a single
        # statically-linked Go binary, so this is reproducible and small.
        run: |
          set -euo pipefail
          YQ_VERSION=v4.44.3
          curl -fsSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          chmod +x /usr/local/bin/yq

      - name: Verify yq is on PATH
        run: yq --version

      - name: Install Node.js for ajv-cli
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ajv-cli
        run: npm install -g ajv-cli@5

      - name: Install crossplane CLI v1.17.3
        # install.sh is flaky on GHA runners (CDN returns 403 to plain
        # curl UAs in the runner egress range, leaving no binary for the
        # subsequent install step). Pull the static `crank` binary
        # directly with a browser User-Agent and curl-native retry,
        # matching the pattern in profile-validate.yml.
        run: |
          set -euo pipefail
          XP_VERSION=v1.17.3
          curl --fail --silent --show-error --location \
               --retry 6 --retry-all-errors --retry-delay 4 \
               --connect-timeout 20 \
               -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
               -o /tmp/crank \
               "https://releases.crossplane.io/stable/${XP_VERSION}/bin/linux_amd64/crank"
          sudo install -m 0755 /tmp/crank /usr/local/bin/crossplane
          crossplane --help >/dev/null

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Parse claims (yq + JSON Schema)
        run: bash infra/crossplane/claims/tests/parse_claims.sh

      - name: Render claims (crossplane render)
        run: bash infra/crossplane/claims/tests/render_all.sh

      - name: Run claim bats suite
        run: |
          for f in infra/crossplane/claims/tests/test_*.bats; do
            bats "${f}"
          done
