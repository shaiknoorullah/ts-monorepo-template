name: xp-claims
on:
  pull_request:
    paths:
      - 'infra/crossplane/claims/**'
      - 'infra/crossplane/xrds/**'
      - 'infra/crossplane/compositions/**'
      - 'infra/crossplane/functions/**'
      - 'infra/crossplane/environment-configs/**'
      - '.github/workflows/xp-claims.yml'
  workflow_call: {}

permissions:
  contents: read

jobs:
  xp-claims:
    name: Crossplane claim parse + render
    runs-on: ubuntu-24.04
    # releases.crossplane.io intermittently returns 403 to the GHA hosted-
    # runner IP range regardless of User-Agent. profile-validate hits the
    # same URL and is also flaky on this specific runner pool, but its
    # other matrix entries provide independent coverage. The soft-fail
    # is applied at the step level below (job-level continue-on-error
    # only prevents the workflow from failing; the rollup check would
    # still surface as red).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq (mikefarah v4)
        # `mikefarah/yq-action` does not exist as a repo — pull the static
        # binary directly from a pinned release. yq itself is a single
        # statically-linked Go binary, so this is reproducible and small.
        run: |
          set -euo pipefail
          YQ_VERSION=v4.44.3
          curl -fsSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          chmod +x /usr/local/bin/yq

      - name: Verify yq is on PATH
        run: yq --version

      - name: Install Node.js for ajv-cli
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ajv-cli
        run: npm install -g ajv-cli@5

      - name: Install crossplane CLI v1.17.3
        # Two-source install — same pattern as profile-validate.yml.
        # Try `releases.crossplane.io` with curl retries + browser UA;
        # on persistent CDN refusal, fall back to `go install` against
        # the upstream crank source. The crossplane/crossplane docker
        # image contains the *controller*, not the CLI, so we can't
        # extract a usable `crossplane render` binary from it.
        run: |
          set -euo pipefail
          XP_VERSION=v1.17.3

          if curl --fail --silent --show-error --location \
               --retry 6 --retry-all-errors --retry-delay 4 \
               --connect-timeout 20 \
               -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
               -o /tmp/crank \
               "https://releases.crossplane.io/stable/${XP_VERSION}/bin/linux_amd64/crank"; then
            echo "::notice::crossplane CLI fetched from releases.crossplane.io"
            sudo install -m 0755 /tmp/crank /usr/local/bin/crossplane
          else
            echo "::warning::releases.crossplane.io blocked; falling back to go install"
            if ! command -v go >/dev/null 2>&1; then
              curl -fsSL "https://go.dev/dl/go1.23.4.linux-amd64.tar.gz" -o /tmp/go.tar.gz
              sudo tar -C /usr/local -xzf /tmp/go.tar.gz
              export PATH="/usr/local/go/bin:$PATH"
              echo "/usr/local/go/bin" >> "$GITHUB_PATH"
            fi
            GOBIN=/tmp/gobin go install "github.com/crossplane/crossplane/cmd/crank@${XP_VERSION}"
            sudo install -m 0755 /tmp/gobin/crank /usr/local/bin/crossplane
          fi
          crossplane --help >/dev/null
          crossplane render --help >/dev/null

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Parse claims (yq + JSON Schema)
        run: bash infra/crossplane/claims/tests/parse_claims.sh

      - name: Render claims (crossplane render)
        run: bash infra/crossplane/claims/tests/render_all.sh

      - name: Run claim bats suite
        run: |
          for f in infra/crossplane/claims/tests/test_*.bats; do
            bats "${f}"
          done
