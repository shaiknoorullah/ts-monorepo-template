# ------------------------------------------------------------------------------
# renovate-validate.yml — Lint renovate.json on every change
#
# Triggers: PRs / pushes that modify `renovate.json` or `.github/renovate.json5`.
# Purpose:  Catch invalid Renovate config before it lands and stalls upgrades.
# Safety:   - Action pinned to 40-char SHA.
# ------------------------------------------------------------------------------

name: Renovate config validation

on:
  push:
    branches: [main]
    paths:
      - 'renovate.json'
      - 'renovate.json5'
      - '.github/renovate.json'
      - '.github/renovate.json5'
  pull_request:
    paths:
      - 'renovate.json'
      - 'renovate.json5'
      - '.github/renovate.json'
      - '.github/renovate.json5'

permissions:
  contents: read

jobs:
  validate:
    name: Validate Renovate config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate
        uses: suzuki-shunsuke/github-action-renovate-config-validator@36a15b83e37bf3221dc9c02ff5ffdaefb51ca1cf # v1.1.1
        with:
          strict: true
