# ------------------------------------------------------------------------------
# release-notes.yml — Regenerate release notes after a release lands
#
# Triggers: workflow_run completion of the Release workflow OR tag pushes
#           matching `v*`.
# Purpose:  Re-run GitHub's auto-generated release notes using `.github/release.yml`
#           categorization. Useful when changesets/action publishes but doesn't
#           use the project's PR-category labels.
# Safety:   - Uses gh CLI with GITHUB_TOKEN (no third-party tokens).
#           - All `run:` commands consume input via env, not direct interpolation.
# ------------------------------------------------------------------------------

name: Release notes

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-notes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate release notes
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Resolve target tag
        id: tag
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            TAG="${REF#refs/tags/}"
          else
            TAG="$(git tag --sort=-creatordate | head -n1 || true)"
          fi
          if [ -z "$TAG" ]; then
            echo "No tag found — nothing to regenerate."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Regenerate notes for tag
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # Use the repo's `.github/release.yml` categorization (auto-generated notes).
          NOTES="$(gh api \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" \
            --jq '.body')"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --title "$TAG" --notes "$NOTES"
          fi
