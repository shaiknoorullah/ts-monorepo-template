# ------------------------------------------------------------------------------
# release.yml — Changesets-driven release
#
# Triggers: push to main.
# Purpose:  Open or update the "Version Packages" PR via changesets/action.
#           When that PR is merged, this same workflow publishes to npm.
# Safety:   - Skips when the head commit author is github-actions[bot] to avoid
#             release-loop recursion after the bot merges its own PR.
#           - All third-party Actions pinned to 40-char commit SHAs.
#           - Concurrency group "release", no cancel-in-progress (don't kill an
#             in-flight publish).
# ------------------------------------------------------------------------------

name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version / Publish
    runs-on: ubuntu-latest
    # Skip when github-actions[bot] is the commit author (avoid recursion after
    # the Version Packages PR auto-merges).
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.15.0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm exec nx run-many -t build

      - name: Create Release PR or Publish
        uses: changesets/action@c8bada60c408975afd1a20b3db81d6eee6789308 # v1.4.9
        with:
          publish: pnpm release
          version: pnpm version-packages
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
