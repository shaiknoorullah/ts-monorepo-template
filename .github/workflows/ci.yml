# ------------------------------------------------------------------------------
# ci.yml — Continuous Integration
#
# Triggers: PRs against main, pushes to main.
# Purpose:  Parallel lint / type-check (Node 20+22 matrix) / test+coverage /
#           build / deps-quartet jobs. Coverage uploaded to Codecov.
# Safety:   - All third-party Actions pinned to 40-char commit SHAs.
#           - No untrusted ${{ github.event.* }} expanded inside `run:` blocks
#             without going through an `env:` indirection first.
#           - Concurrency: cancel in-progress runs per ref to save CI minutes.
# ------------------------------------------------------------------------------

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.15.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: ESLint (flat config)
        # NOTE: warnings are tracked but not fail-the-build. We have a backlog
        # of legitimate warnings (deprecations, sonarjs hints, etc.) being
        # converted to errors incrementally. See eslint.config.mjs TODOs.
        run: pnpm exec eslint . --quiet

      - name: Prettier --check
        run: pnpm exec prettier --check .

      - name: markdownlint
        run: pnpm dlx markdownlint-cli2 "**/*.md" "#node_modules" "#**/CHANGELOG.md"

      - name: cspell
        # Pin to 8.x — cspell 9.x requires Node 22.18+ and we're on 22.13
        # (template needs to be conservative). TODO: bump .nvmrc and remove pin.
        run: pnpm dlx cspell@^8.0.0 --no-progress --no-summary "**/*.{md,ts,tsx,js,jsx,json,yml,yaml}" || true
        continue-on-error: true

      - name: yamllint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3.1.1
        with:
          format: github
          strict: false
          config_file: .yamllint.yml
        continue-on-error: true

      - name: shellcheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # v2.0.0
        with:
          severity: warning
          ignore_paths: node_modules .nx .next .astro .expo .wrangler dist coverage sbom
        continue-on-error: true

  type-check:
    name: Type-check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.15.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check

  test:
    name: Test + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.15.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install go-task
        # @internal/schemas + @internal/scripts integration tests shell out to
        # `task` (meta:validate, adr:new, adr:index). Match the install pattern
        # used in site-build.yml's quickstart-verify job.
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0565863a31f2c772f9f0395002a31e3f06189574 # v5.0.7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.15.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install uv
        # @nxlv/python's build target shells out to `uv` to install Python deps.
        # Without it, py-hello:build fails: "UV is not installed."
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nx run-many -t build

  deps:
    name: Deps hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.15.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: knip (dead code/exports)
        # Reports unused exports/deps but does NOT fail CI — we have a backlog
        # of legitimate intentional unused exports (public API surface,
        # template stubs) that need per-package curation. See knip.json TODOs.
        run: pnpm exec knip --no-exit-code || true
        continue-on-error: true

      - name: syncpack lint
        run: pnpm exec syncpack lint

      - name: manypkg check
        run: pnpm exec manypkg check

      - name: Are The Types Wrong (attw)
        # attw needs `dist/` artifacts; we don't run a separate `nx build`
        # in this job because the Build job already covers it. attw's
        # error path on missing-dist is unhelpful ("Cannot read properties
        # of undefined") — soft-fail until we wire build outputs in.
        run: pnpm exec nx run-many -t attw || true
        continue-on-error: true

      - name: publint
        run: pnpm exec nx run-many -t publint || true
        continue-on-error: true

      - name: type-coverage (>= 95%)
        run: pnpm exec type-coverage --at-least 95 --strict --detail
