# ------------------------------------------------------------------------------
# codeql.yml — GitHub CodeQL static analysis
#
# Triggers: push to main, PRs, and weekly Sunday 03:00 UTC.
# Purpose:  SAST for JavaScript + TypeScript using GitHub's CodeQL engine.
# Safety:   - All third-party Actions pinned to 40-char commit SHAs.
#           - Uses security-extended + security-and-quality query suites.
# ------------------------------------------------------------------------------

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [javascript, typescript]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # CodeQL's diff-aware analysis needs the merge base on `main`; the
          # default fetch-depth: 1 leaves it shallow and `codeql resolve
          # extensions-by-pack` aborts with
          #   git call failed. Cannot fetch main. Error: fatal: error
          #   processing shallow info: 4
          fetch-depth: 0

      - name: Disable diff-aware CodeQL analysis
        # `fetch-depth: 0` + explicit refspec already populates
        # origin/main, but the codeql-action's diff-range generator still
        # hits `fatal: error processing shallow info: 4` from its own
        # internal `git fetch` invocation against a base it can't see.
        # The cleanest unblock for a bootstrap PR is to opt out of
        # diff-aware analysis entirely — codeql still runs the full
        # security-extended + security-and-quality query suites, it just
        # uploads results for the whole codebase rather than only the
        # diff.
        run: |
          {
            echo 'CODEQL_ACTION_PR_DIFF_RANGE_ENABLED=false'
            echo 'CODEQL_ACTION_DIFF_INFORMED_QUERIES=false'
          } >> "$GITHUB_ENV"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4f3212b61783c3c68e8309a0f18a699764811cda # v3.27.5
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@4f3212b61783c3c68e8309a0f18a699764811cda # v3.27.5

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@4f3212b61783c3c68e8309a0f18a699764811cda # v3.27.5
        with:
          category: '/language:${{ matrix.language }}'
