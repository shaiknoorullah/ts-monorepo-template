# ------------------------------------------------------------------------------
# lighthouse-ci.yml — Lighthouse budgets for marketing + docs-public
#
# Triggers: PRs that touch apps/marketing/** or apps/docs-public/**, and
#           also callable from the nightly workflow.
# Purpose:  Build each public-facing app, serve it locally, run Lighthouse CI
#           against a hard mobile budget defined in .lighthouserc.json
#           (Perf/A11y/BP/SEO >= 95; LCP < 2.5s; CLS < 0.1; INP < 200ms).
# Safety:   - All third-party Actions pinned to 40-char commit SHAs.
# ------------------------------------------------------------------------------

name: Lighthouse CI

on:
  pull_request:
    paths:
      - 'apps/marketing/**'
      - 'apps/docs-public/**'
      - '.lighthouserc.json'
      - '.github/workflows/lighthouse-ci.yml'
  workflow_call:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: lhci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lhci:
    name: Lighthouse (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [marketing, docs-public]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.15.0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build app
        env:
          APP: ${{ matrix.app }}
        run: pnpm --filter "@app/${APP}" build

      - name: Render lighthouse config with ${LHCI_APP} substituted
        # `.lighthouserc.json`'s `staticDistDir` contains a literal
        # `${LHCI_APP}` placeholder. lhci's JSON parser does not interpolate
        # env vars in config files, so render the file with envsubst first
        # and point the action at the rendered copy.
        env:
          LHCI_APP: ${{ matrix.app }}
        run: |
          export LHCI_APP
          envsubst < .lighthouserc.json > /tmp/lighthouserc.rendered.json
          cat /tmp/lighthouserc.rendered.json

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.1.0
        with:
          configPath: /tmp/lighthouserc.rendered.json
          uploadArtifacts: true
          temporaryPublicStorage: true
