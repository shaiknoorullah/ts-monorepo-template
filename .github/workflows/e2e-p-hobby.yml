name: e2e-p-hobby
on:
  pull_request:
    paths:
      - 'profiles/p-hobby/**'
      - 'infra/terraform/modules/hetzner/**'
      - 'infra/ansible/playbooks/single-node.yml'
      - 'infra/ansible/roles/**'
      - 'infra/helm/**'
      - 'infra/crossplane/**'
      - 'apps/**'
      - '.github/workflows/e2e-p-hobby.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: e2e-p-hobby-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bringup:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PROFILE: p-hobby
      HETZNER_TOKEN_CI: ${{ secrets.HETZNER_TOKEN_CI }}
    steps:
      - name: Guard — require ephemeral Hetzner project credentials
        id: guard
        run: |
          if [[ -z "${HETZNER_TOKEN_CI}" ]]; then
            echo "::warning::HETZNER_TOKEN_CI not set; skipping e2e-p-hobby"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - if: steps.guard.outputs.skip != 'true'
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
      - if: steps.guard.outputs.skip != 'true'
        uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc # v15
        with:
          name: devenv
      - if: steps.guard.outputs.skip != 'true'
        run: nix profile install nixpkgs#devenv
      - if: steps.guard.outputs.skip != 'true'
        name: Budget precheck — Hetzner ephemeral project spend cap
        run: devenv shell -- task ci:budget:precheck PROFILE=p-hobby CLOUD=hetzner
      - if: steps.guard.outputs.skip != 'true'
        name: Materialize profile
        run: devenv shell -- task profile:select PROFILE="${PROFILE}"
      - if: steps.guard.outputs.skip != 'true'
        name: Validate profile
        run: devenv shell -- task profile:validate
      - if: steps.guard.outputs.skip != 'true'
        name: Terraform apply (1 VPS, ephemeral project)
        run: |
          terraform -chdir=bootstrap/terraform/hetzner init -backend-config=profile=p-hobby
          terraform -chdir=bootstrap/terraform/hetzner apply -var profile=p-hobby -auto-approve
      - if: steps.guard.outputs.skip != 'true'
        name: Ansible single-node bringup
        run: ansible-playbook ansible/single-node.yml -i bootstrap/terraform/hetzner/inventory.ini
      - if: steps.guard.outputs.skip != 'true'
        name: Helm install core stack
        run: devenv shell -- task ci:bringup:helm PROFILE="${PROFILE}"
      - if: steps.guard.outputs.skip != 'true'
        name: Smoke pack S-01..S-10
        run: devenv shell -- task ci:smoke PROFILE="${PROFILE}"
      - if: steps.guard.outputs.skip != 'true'
        name: Observability parity
        run: devenv shell -- task ci:observability:assert PROFILE="${PROFILE}"
      - if: steps.guard.outputs.skip != 'true'
        name: Claim readiness
        run: devenv shell -- task ci:claims:assert PROFILE="${PROFILE}"
      - if: steps.guard.outputs.skip != 'true'
        name: Image Updater + Kargo promotion
        run: devenv shell -- task ci:image-updater:assert ci:kargo:assert PROFILE="${PROFILE}"
      - if: always() && steps.guard.outputs.skip != 'true'
        name: Collect evidence
        run: devenv shell -- task ci:evidence:collect PROFILE="${PROFILE}"
      - if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: evidence-p-hobby-${{ github.run_id }}
          path: .ci/evidence/p-hobby/
          retention-days: 30
      - if: always() && steps.guard.outputs.skip != 'true'
        name: Teardown — terraform destroy
        run: |
          terraform -chdir=bootstrap/terraform/hetzner destroy -var profile=p-hobby -auto-approve || true
          devenv shell -- task ci:teardown PROFILE=p-hobby
