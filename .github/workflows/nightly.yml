# ------------------------------------------------------------------------------
# nightly.yml — Full nightly verification
#
# Triggers: cron 05:00 UTC daily, plus manual workflow_dispatch.
# Purpose:  Run the full CI surface AND the long-running checks we skip on
#           every PR — Playwright E2E against the marketing + docs-public apps,
#           and Lighthouse CI for both.
# Safety:   - All third-party Actions pinned to 40-char commit SHAs.
#           - Browser binaries cached by Playwright's recommended path.
# ------------------------------------------------------------------------------

name: Nightly

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  full-ci:
    name: Full CI surface
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [marketing, docs-public]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.15.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build target app
        env:
          APP: ${{ matrix.app }}
        run: pnpm --filter "@app/${APP}" build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        env:
          APP: ${{ matrix.app }}
        run: pnpm --filter "@app/${APP}" exec playwright test --reporter=line

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: playwright-report-${{ matrix.app }}
          path: apps/${{ matrix.app }}/playwright-report
          retention-days: 14

  lighthouse:
    name: Lighthouse CI
    uses: ./.github/workflows/lighthouse-ci.yml
    secrets: inherit
