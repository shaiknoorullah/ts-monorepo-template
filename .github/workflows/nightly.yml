name: nightly
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      profiles:
        description: 'comma-separated profile IDs (default: all auto)'
        required: false
        default: ''
      chaos:
        description: 'set to 1 to run chaos scenarios'
        required: false
        default: '0'
permissions:
  contents: read
  id-token: write
  actions: read
concurrency:
  group: nightly
  cancel-in-progress: false
jobs:
  bringup:
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: p-solo
            runner: ubuntu-24.04
            schedule: nightly
          - profile: p-hobby
            runner: ubuntu-24.04
            schedule: nightly
          - profile: p-startup-small
            runner: ubuntu-24.04
            schedule: nightly
          - profile: p-startup-scale
            runner: ubuntu-24.04
            schedule: weekly
          - profile: p-enterprise
            runner: ubuntu-24.04
            schedule: manual
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      PROFILE: ${{ matrix.profile }}
      MATRIX_SCHEDULE: ${{ matrix.schedule }}
      CHAOS: ${{ github.event.inputs.chaos || '0' }}
      DISPATCH_PROFILES: ${{ github.event.inputs.profiles }}
    steps:
      - name: Guard — skip non-nightly profiles on cron
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "schedule" && "${MATRIX_SCHEDULE}" != "nightly" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping ${PROFILE} on cron (schedule=${MATRIX_SCHEDULE})"
            exit 0
          fi
          if [[ -n "${DISPATCH_PROFILES}" && ",${DISPATCH_PROFILES}," != *",${PROFILE},"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping ${PROFILE} — not in workflow_dispatch.inputs.profiles"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - if: steps.guard.outputs.skip != 'true'
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
      - if: steps.guard.outputs.skip != 'true'
        uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc # v15
        with:
          name: devenv
      - if: steps.guard.outputs.skip != 'true'
        name: Install devenv
        run: nix profile install nixpkgs#devenv
      - if: steps.guard.outputs.skip != 'true'
        name: Select profile
        run: devenv shell -- task profile:select PROFILE="${PROFILE}"
      - if: steps.guard.outputs.skip != 'true'
        name: Validate profile
        run: devenv shell -- task profile:validate
      - if: steps.guard.outputs.skip != 'true'
        name: Bringup
        env:
          HETZNER_TOKEN_CI: ${{ secrets.HETZNER_TOKEN_CI }}
          AZURE_TENANT_ID_CI: ${{ secrets.AZURE_TENANT_ID_CI }}
          AWS_ROLE_ARN_CI: ${{ secrets.AWS_ROLE_ARN_CI }}
        run: devenv shell -- task ci:bringup PROFILE="${PROFILE}"
      - if: steps.guard.outputs.skip != 'true'
        name: Smoke pack
        run: devenv shell -- task ci:smoke PROFILE="${PROFILE}"
      - if: steps.guard.outputs.skip != 'true'
        name: Observability parity
        run: devenv shell -- task ci:observability:assert PROFILE="${PROFILE}"
      - if: steps.guard.outputs.skip != 'true'
        name: Cost band check
        run: devenv shell -- task ci:cost:simulate PROFILE="${PROFILE}"
      - if: always() && steps.guard.outputs.skip != 'true'
        name: Collect evidence
        run: devenv shell -- task ci:evidence:collect PROFILE="${PROFILE}"
      - if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: evidence-${{ matrix.profile }}-${{ github.run_id }}
          path: .ci/evidence/${{ matrix.profile }}/
          retention-days: 30
      - if: always() && steps.guard.outputs.skip != 'true'
        name: Teardown
        run: devenv shell -- task ci:teardown PROFILE="${PROFILE}"
  summary:
    needs: bringup
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: .ci/evidence/
      - name: Aggregate matrix verdict
        run: bash tools/ci/nightly-summary.sh
