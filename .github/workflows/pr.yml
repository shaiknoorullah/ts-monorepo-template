# .github/workflows/pr.yml
# Phase 2 green gate: prove that the Launcher CLI + Taskfile + devenv shell
# all evaluate cleanly on a fresh GH-hosted runner.
name: pr

on:
  pull_request:
    branches: [main]

jobs:
  cli-test:
    name: cli-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v14
      - uses: cachix/cachix-action@v15
        with:
          name: devenv
      - name: Install devenv
        run: nix profile install nixpkgs#devenv
      - name: Install task
        run: nix profile install nixpkgs#go-task
      - name: pnpm install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: task --list smoke
        run: task --list
      - name: vitest internal/cli
        run: pnpm vitest run internal/cli
      - name: devenv test (shell evaluates)
        run: devenv test

  nx-affected:
    name: nx-affected
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: nrwl/nx-set-shas@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - uses: astral-sh/setup-uv@v3
        with: { version: '0.4.x' }
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: '1.83' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx affected -t lint test build --parallel=3

  polyglot-typecheck:
    name: polyglot-typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - uses: astral-sh/setup-uv@v3
        with: { version: '0.4.x' }
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: '1.83', components: 'clippy' }
      - run: pnpm install --frozen-lockfile
      - name: tsc typecheck
        run: pnpm tsc -p tsconfig.base.json --noEmit
      - name: mypy py-hello
        working-directory: apps/py-hello
        run: uv sync --extra dev && uv run mypy src
      - name: cargo check rs-hello
        run: cargo check -p rs-hello --all-targets
      - name: go build go-hello
        working-directory: apps/go-hello
        run: go build ./...
