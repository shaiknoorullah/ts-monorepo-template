name: web-app build + deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/web-app/**'
      - 'packages/**'
      - '.github/workflows/web-build.yml'
  pull_request:
    paths:
      - 'apps/web-app/**'
      - 'packages/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.15.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @app/web-app type-check
      - run: pnpm --filter @app/web-app build:web

      - name: Check for CLOUDFLARE_API_TOKEN
        id: cf_token
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN secret not configured — skipping deploy."
          fi

      - name: Upload build artifact (no-deploy mode)
        if: steps.cf_token.outputs.present == 'false'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: web-app-dist
          path: apps/web-app/dist
          retention-days: 14

      - name: Publish to Cloudflare Pages (preview)
        if: github.event_name == 'pull_request' && steps.cf_token.outputs.present == 'true'
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web-app/dist --project-name=web-app --branch=preview-${PR_NUMBER}

      - name: Publish to Cloudflare Pages (production)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.cf_token.outputs.present == 'true'
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web-app/dist --project-name=web-app --branch=main
