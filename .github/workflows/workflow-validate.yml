name: workflow-validate
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'tools/ci/workflow-validate/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'tools/ci/workflow-validate/**'
permissions:
  contents: read
concurrency:
  group: workflow-validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.4/scripts/download-actionlint.bash)
          sudo mv actionlint /usr/local/bin/
      - name: Install zizmor (via uv)
        uses: astral-sh/setup-uv@77c28f02b3322332d4a4446b3177f426da8bf086 # v5.0.1
      - run: uv tool install zizmor==1.0.0
      - name: Install act
        run: |
          curl -fsSL https://raw.githubusercontent.com/nektos/act/v0.2.68/install.sh | sudo bash -s -- -b /usr/local/bin
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run workflow-validate
        run: bash tools/ci/workflow-validate/run.sh
      - name: Run unit tests
        run: bats tools/ci/workflow-validate/run.test.bats
