name: profile-validate

on:
  pull_request:
    paths:
      - 'profiles/**'
      - 'infra/helm/**'
      - 'infra/crossplane/**'
      - 'internal/cli/src/commands/profile/**'
      - 'internal/schemas/**'
      - '.github/workflows/profile-validate.yml'
      - 'tools/ci/profile-validate.sh'
      - 'tools/ci/check-composition-pins.mjs'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  profile-validate:
    name: profile-validate (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile:
          - p-solo
          - p-hobby
          - p-startup-small
          - p-startup-scale
          - p-enterprise
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.16.3'
      - name: Install kubeconform
        run: |
          curl -fsSL -o /tmp/kc.tgz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          sudo tar -xzf /tmp/kc.tgz -C /usr/local/bin kubeconform
      - name: Install crossplane CLI
        # crossplane's install.sh occasionally returns a partial response on
        # GHA runners; the retry covers transient network blips. Tail keeps
        # the install behavior identical to the one-shot form.
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl -fsSL https://raw.githubusercontent.com/crossplane/crossplane/release-1.17/install.sh \
                | XP_CHANNEL=stable XP_VERSION=v1.17.3 sh; then
              break
            fi
            echo "crossplane install attempt ${attempt} failed; retrying"
            sleep 3
          done
          sudo install -m 0755 crossplane /usr/local/bin/crossplane
          crossplane --help >/dev/null
      - run: pnpm install --frozen-lockfile
      - name: Build helm chart dependencies (lib-chart)
        # Each apps/<svc>/Chart.yaml depends on `file://../../lib-chart`.
        # `helm template` (used inside profile:validate) requires the dep to
        # be present under `charts/`; only `helm dependency build` populates
        # that directory.
        run: |
          set -euo pipefail
          for chart_dir in infra/helm/apps/*/; do
            echo "==> helm dependency build ${chart_dir}"
            helm dependency build "${chart_dir}"
          done
      - name: Run profile:validate
        run: ./tools/ci/profile-validate.sh ${{ matrix.profile }}
