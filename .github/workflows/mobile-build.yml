name: mobile EAS build

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app to build'
        required: true
        type: choice
        options: [mobile-customer, mobile-admin]
      profile:
        description: 'EAS build profile'
        required: true
        type: choice
        default: preview
        options: [development, preview, production]
      platform:
        description: 'Platform'
        required: true
        type: choice
        default: all
        options: [ios, android, all]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP: ${{ inputs.app }}
      PROFILE: ${{ inputs.profile }}
      PLATFORM: ${{ inputs.platform }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.15.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: expo/expo-github-action@5db2a8ba8fb16d4ed5e9e1eebadc40e2eaf3e2bf # v8.2.2
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@app/${APP}" type-check
      - name: EAS build
        run: eas build --non-interactive "--profile=${PROFILE}" "--platform=${PLATFORM}"
        working-directory: apps/${{ inputs.app }}
