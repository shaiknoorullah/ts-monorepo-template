[project]
name = "contracts"
version = "0.0.0"
description = "Python bindings for ts-monorepo-template/contracts (generated via buf)."
requires-python = ">=3.13"
dependencies = [
  "protobuf>=5.28.0,<6",
  "grpcio>=1.66.0,<2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contracts"]

[dependency-groups]
dev = [
  "pytest>=8.3",
]
