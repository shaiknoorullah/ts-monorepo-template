// health.v1 — health-check contract shared across go-hello, py-hello, rs-hello.
// Endpoints map: /healthz -> Check(liveness), /readyz -> Check(readiness).
syntax = "proto3";

package health.v1;

option go_package = "github.com/ts-monorepo-template/contracts/gen/go/health/v1;healthv1";

message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  enum ServingStatus {
    SERVING_STATUS_UNSPECIFIED = 0;
    SERVING_STATUS_SERVING = 1;
    SERVING_STATUS_NOT_SERVING = 2;
  }
  ServingStatus status = 1;
}

service HealthCheck {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
}
