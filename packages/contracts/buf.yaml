version: v2
modules:
  - path: src/proto
    name: buf.build/ts-monorepo-template/contracts
lint:
  use:
    - STANDARD
  except:
    # Per-package directories already encode the version (user/v1, health/v1).
    - PACKAGE_VERSION_SUFFIX
    # gRPC standard health-checking service is named "HealthCheck" (not "HealthCheckService")
    # and uses HealthCheckRequest/Response. Waivers align with the upstream convention.
    - SERVICE_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    # UserService deliberately re-uses the User message as response for GetUser/CreateUser.
    # Resource-style APIs favor returning the bare resource over wrapper response messages.
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
