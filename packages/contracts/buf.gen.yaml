# buf.gen.yaml — generates per-language bindings into gen/<lang>/.
# Go, TS, Rust outputs are committed; Python is regenerated into the wheel under packages/contracts-py.
version: v2
managed:
  enabled: true
plugins:
  # Go — messages + gRPC.
  - remote: buf.build/protocolbuffers/go:v1.34.2
    out: gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go:v1.5.1
    out: gen/go
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false

  # TypeScript — @bufbuild/protobuf-es (no runtime gRPC; HTTP/connect-style is wired in app code).
  - remote: buf.build/bufbuild/es:v2.2.3
    out: gen/ts
    opt:
      - target=ts
      - import_extension=.js

  # Python — used by packages/contracts-py wheel build.
  - remote: buf.build/protocolbuffers/python:v28.3
    out: gen/py
  - remote: buf.build/grpc/python:v1.66.2
    out: gen/py

  # Rust — prost messages + tonic gRPC.
  - remote: buf.build/community/neoeinstein-prost:v0.4.0
    out: gen/rs/src
    opt:
      - file_descriptor_set
  - remote: buf.build/community/neoeinstein-tonic:v0.4.1
    out: gen/rs/src
    opt:
      - no_include
      - compile_well_known_types
