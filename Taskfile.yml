version: '3'

includes:
  api: { taskfile: apps/api/Taskfile.yml, dir: apps/api, optional: true }
  web: { taskfile: apps/web/Taskfile.yml, dir: apps/web, optional: true }
  worker: { taskfile: apps/worker-py/Taskfile.yml, dir: apps/worker-py, optional: true }
  # Phase 4 polyglot reference apps. Path prefixed with ./ so the conformance
  # test in tests/taskfile/app-includes.test.ts can assert the canonical form
  # called out in spec section 2.5.
  go-hello:
    taskfile: ./apps/go-hello/Taskfile.yml
    dir: ./apps/go-hello
  py-hello:
    taskfile: ./apps/py-hello/Taskfile.yml
    dir: ./apps/py-hello
  rs-hello:
    taskfile: ./apps/rs-hello/Taskfile.yml
    dir: ./apps/rs-hello

vars:
  # Run the CLI directly from source via tsx instead of `ts-monorepo`
  # (which requires the package to be built and on PATH). This keeps
  # the CLI usable in CI before `pnpm build` has run, and in fresh
  # devenv shells where bin shims have not been linked yet.
  CLI: 'pnpm --filter @internal/cli exec tsx src/bin/ts-monorepo.ts'

tasks:
  # --- bootstrap ---
  install:
    desc: Bootstrap the dev shell
    cmds:
      - bash scripts/dev/install.sh

  # --- nx delegates ---
  dev:
    desc: Run all apps in dev (Nx run-many)
    cmds: [pnpm nx run-many --target=dev --all]
  test:
    desc: Nx affected test
    cmds: [pnpm nx affected --target=test]
  lint:
    desc: Nx affected lint
    cmds: [pnpm nx affected --target=lint]
  format:
    desc: Nx affected format
    cmds: [pnpm nx affected --target=format]
  ci:
    desc: install + lint + test + build
    deps: [install]
    cmds:
      - task lint
      - task test
      - pnpm nx affected --target=build

  # --- e2e bringup stubs (Phase 14 §13.3 §15.4) -----------------------------
  # The bootstrap PR landed the foundation but the per-profile bringup
  # workflows reference `task ci:bringup` / `task ci:smoke` / etc. that
  # haven't been wired up yet. Stubs below let the e2e-p-{solo,hobby,
  # startup-small} workflows complete without erroring on a missing verb.
  # Each stub:
  #  1. Echos a `::notice::` so the GHA log clearly marks the step as
  #     a no-op pending real implementation.
  #  2. Exits 0 so downstream `if: always()` steps (evidence collection,
  #     teardown) still fire.
  # Replace each stub body with the real impl as the corresponding
  # follow-up PR lands. Tracked alongside the "Known issues" list in
  # the bootstrap PR description.
  ci:bringup:
    desc: '[stub] k3d + Crossplane + ESO + ArgoCD bringup for $PROFILE'
    cmds:
      - 'echo "::notice::ci:bringup is a stub — wire up k3d + Crossplane + ESO + ArgoCD in a follow-up PR"'
  ci:smoke:
    desc: '[stub] Smoke pack S-01..S-10 for $PROFILE'
    cmds:
      - 'echo "::notice::ci:smoke is a stub — wire up smoke pack S-01..S-10 in a follow-up PR"'
  ci:observability:assert:
    desc: '[stub] Observability parity (Layer 5) for $PROFILE'
    cmds:
      - 'echo "::notice::ci:observability:assert is a stub — wire up Layer 5 parity check in a follow-up PR"'
  ci:claims:assert:
    desc: '[stub] Claim readiness — XPostgresCluster, XKafkaTopic, XBucket for $PROFILE'
    cmds:
      - 'echo "::notice::ci:claims:assert is a stub — wire up XR claim readiness assertions in a follow-up PR"'
  ci:image-updater:assert:
    desc: '[stub] Argo Image Updater dev-env smoke for $PROFILE'
    cmds:
      - 'echo "::notice::ci:image-updater:assert is a stub — wire up Image Updater smoke in a follow-up PR"'
  ci:kargo:assert:
    desc: '[stub] Kargo promotion staging → prod for $PROFILE'
    cmds:
      - 'echo "::notice::ci:kargo:assert is a stub — wire up Kargo promotion assertion in a follow-up PR"'
  ci:evidence:collect:
    desc: '[stub] Collect bringup evidence artifacts for $PROFILE'
    cmds:
      - 'mkdir -p .ci/evidence/${PROFILE:-p-solo}'
      - 'echo "ci:evidence:collect stub — no artifacts produced yet" > .ci/evidence/${PROFILE:-p-solo}/STATUS.txt'
      - 'echo "::notice::ci:evidence:collect is a stub — wire up real evidence collection in a follow-up PR"'
  ci:teardown:
    desc: '[stub] Tear down bringup stack for $PROFILE'
    cmds:
      - 'echo "::notice::ci:teardown is a stub — wire up k3d cluster teardown in a follow-up PR"'
  clean:
    desc: Nx reset + scrub caches
    cmds:
      - pnpm nx reset
      - rm -rf node_modules .venv target .nx

  # --- data plane (delegates to docker-compose; stubs land in Phase 5) ---
  data:up:
    desc: docker-compose up postgres + redis
    cmds: [bash scripts/dev/data-up.sh minimal]
  data:up:full:
    cmds: [bash scripts/dev/data-up.sh full]
  data:up:kafka:
    cmds: [bash scripts/dev/data-up.sh kafka]
  data:up:storage:
    cmds: [bash scripts/dev/data-up.sh storage]
  data:down:
    cmds: [bash scripts/dev/data-down.sh]
  tools:up:
    cmds: [bash scripts/dev/tools-up.sh]
  tools:down:
    cmds: [bash scripts/dev/tools-down.sh]

  # --- db (delegated to per-app Taskfiles) ---
  db:migrate:
    cmds: [pnpm nx run-many --target=db:migrate --all]
  db:seed:
    cmds: [pnpm nx run-many --target=db:seed --all]
  db:reset:
    cmds:
      - task data:down
      - task data:up
      - task db:migrate
      - task db:seed

  # --- commit ---
  commit:
    desc: Constrained AI commit
    cmds: [bash scripts/dev/task-commit.sh]

  # --- env / secrets / profiles (delegate to CLI) ---
  env:reconcile:
    cmds: [bash scripts/dev/env-reconcile.sh --write]
  env:check:
    cmds: [bash scripts/dev/env-reconcile.sh --check]
  secrets:check:
    cmds:
      ['{{.CLI}} secrets:check --file secretspec.toml --profile {{.PROFILE | default "p-solo"}}']
  secrets:bootstrap:
    cmds: [bash scripts/dev/bootstrap-secrets.sh]
  secrets:where:
    cmds: ['{{.CLI}} secrets:where']
  profile:list:
    cmds: ['{{.CLI}} profile:list']
  profile:select:
    # Accept either a `PROFILE=<id>` task var (used by the e2e
    # workflows) or a positional via `task profile:select -- <id>`
    # (CLI_ARGS).
    cmds: ['{{.CLI}} profile:select {{.PROFILE | default ""}} {{.CLI_ARGS}}']
  profile:diff:
    cmds: ['{{.CLI}} profile:diff {{.CLI_ARGS}}']
  profile:fork:
    cmds: ['{{.CLI}} profile:fork {{.CLI_ARGS}}']
  profile:validate:
    cmds: ['{{.CLI}} profile:validate {{.CLI_ARGS}}']

  # --- scaffolding ---
  new:backend:
    cmds: ['{{.CLI}} new:backend']
  new:lib:
    cmds: ['{{.CLI}} new:lib']
  new:frontend:
    cmds: ['{{.CLI}} new:frontend']

  # --- launcher ---
  init:
    cmds: ['{{.CLI}} init']
  launch:
    cmds: ['{{.CLI}} launch']

  # --- ADRs (Phase 1) ---
  adr:new:
    desc: Create a new ADR from docs/adrs/_template.md
    cmds:
      - |
        next=$(ls docs/adrs/ | grep -E '^[0-9]{4}-' | sed -E 's/^([0-9]{4}).*/\1/' | sort -n | tail -1)
        next=$((10#${next:-0000} + 1))
        printf -v id "%04d" "$next"
        slug="${SLUG:-untitled}"
        out="docs/adrs/${id}-${slug}.md"
        cp docs/adrs/_template.md "$out"
        sed -i "s/^id: 0000/id: ${id}/" "$out"
        sed -i "s/^date: .*/date: $(date -u +%Y-%m-%d)/" "$out"
        echo "Wrote $out"

  adr:index:
    desc: Regenerate docs/adrs/README.md from frontmatter
    cmds:
      - |
        {
          echo "# Architecture Decision Records"
          echo
          echo "Auto-generated by \`task adr:index\`. Do not hand-edit."
          echo
          echo "| ID | Status | Title |"
          echo "| -- | ------ | ----- |"
          for f in $(ls docs/adrs/[0-9]*.md | sort); do
            id=$(awk -F': ' '/^id:/{print $2; exit}' "$f")
            status=$(awk -F': ' '/^status:/{print $2; exit}' "$f")
            title=$(grep -m1 '^# ADR-' "$f" | sed -E 's/^# //')
            echo "| ${id} | ${status} | [${title}](./$(basename "$f")) |"
          done
        } > docs/adrs/README.md
        echo "Regenerated docs/adrs/README.md"

  # --- ArgoCD / Kargo validation (Phase 7) ---
  argocd:render:
    desc: Render appset-apps + appset-platform offline (no cluster).
    cmds:
      - mkdir -p .render
      - |
        if command -v argocd >/dev/null 2>&1; then
          argocd appset generate infra/argocd/appset-apps.yaml -o yaml > .render/appset-apps.rendered.yaml
          argocd appset generate infra/argocd/appset-platform.yaml -o yaml > .render/appset-platform.rendered.yaml
          echo "Rendered ApplicationSets at .render/"
        else
          echo "argocd CLI not on PATH; skipping render. Install via the argo-validate workflow or 'brew install argocd' for local runs."
          echo "(Set ARGO_VALIDATE_STRICT=1 to make this a hard failure.)"
          if [ "${ARGO_VALIDATE_STRICT:-0}" = "1" ]; then exit 1; fi
        fi

  argocd:validate:
    desc: Run the full layer-7 validation gate locally (same as CI argo-validate).
    deps: [argocd:render]
    cmds:
      - scripts/ci/argo-validate.sh

  meta:validate:
    desc: Validate every META.yaml against internal/schemas/meta-v1.schema.json
    vars:
      META_GLOB: '{{.META_GLOB | default "**/META.yaml"}}'
    cmds:
      - |
        set -e
        files=$(find . -name META.yaml \
          -not -path "./node_modules/*" \
          -not -path "./.tmp-meta-fixtures/*" \
          2>/dev/null || true)
        if [ -n "{{.META_GLOB}}" ] && [ "{{.META_GLOB}}" != "**/META.yaml" ]; then
          files="{{.META_GLOB}}"
        fi
        if [ -z "$files" ]; then
          echo "No META.yaml files found; nothing to validate."
          exit 0
        fi
        for f in $files; do
          pnpm exec ajv validate \
            --spec=draft2020 \
            -s internal/schemas/meta-v1.schema.json \
            -d "$f" \
            --strict=true
        done
        echo "All META.yaml files valid."

  # --- Per-commit gate matrix (Phase 10 §13.3) ---
  ci:gates-for-commit:
    desc: Run gates appropriate to the current HEAD commit subject.
    cmds:
      - |
        set -euo pipefail
        sha=$(git rev-parse HEAD)
        subject=$(git log -1 --format=%s "$sha")
        case "$subject" in
          *terraform*|*"infra/terraform"*)
            task terraform:fmt -- -check
            task terraform:validate
            for e in dev staging prod; do
              (cd infra/terraform/envs/$e \
                && terraform init -backend=false -input=false >/dev/null \
                && terraform plan -lock=false -input=false -no-color \
                    -var-file=terraform.tfvars -out=plan.tfplan >/dev/null \
                && terraform show -json plan.tfplan > plan.tfplan.json)
              conftest test --policy infra/terraform/policies "infra/terraform/envs/$e/plan.tfplan.json"
            done
            ;;
        esac

  # --- Terraform (Phase 10) ---
  terraform:fmt:
    desc: Run terraform fmt across modules + envs (cumulative -check on CI).
    cmds:
      - terraform -chdir=infra/terraform fmt -recursive {{.CLI_ARGS}}

  terraform:validate:
    desc: Run terraform validate against every env stack (no backend init).
    cmds:
      - |
        set -euo pipefail
        for e in dev staging prod; do
          (cd infra/terraform/envs/$e && terraform init -backend=false -input=false >/dev/null && terraform validate -no-color)
        done

  terraform:plan:
    desc: Run terraform plan for the selected ENV against mock backends.
    vars:
      ENV: '{{.ENV | default "dev"}}'
      PROFILE: '{{.PROFILE | default "p-solo"}}'
    cmds:
      - |
        set -euo pipefail
        stack=infra/terraform/envs/{{.ENV}}
        tfvars=profiles/{{.PROFILE}}/terraform.tfvars
        root=$(git rev-parse --show-toplevel)
        if [ -f "$root/$tfvars" ]; then
          varfile="$root/$tfvars"
        else
          varfile="$root/$stack/terraform.tfvars"
        fi
        (cd "$stack" && terraform init -backend=false -input=false >/dev/null && terraform plan -lock=false -input=false -no-color -var-file="$varfile" -out=plan.tfplan)

  terraform:apply:
    desc: Run terraform apply for the selected ENV; appends to audit log (Phase 1).
    vars:
      ENV: '{{.ENV | default "dev"}}'
      PROFILE: '{{.PROFILE | default "p-solo"}}'
    cmds:
      - task: terraform:plan
        vars: { ENV: '{{.ENV}}', PROFILE: '{{.PROFILE}}' }
      - |
        set -euo pipefail
        stack=infra/terraform/envs/{{.ENV}}
        (cd "$stack" && terraform apply -input=false -auto-approve plan.tfplan)
        if [ -x scripts/audit-log-append.sh ]; then
          scripts/audit-log-append.sh terraform:apply env={{.ENV}} profile={{.PROFILE}}
        fi

  # --- Docs generation (Phase 16) ---
  docs:gen:
    desc: Regenerate apps/docs-public reference pages from code (spec Section 15.4).
    cmds:
      - pnpm --filter @app/docs-public docs:gen

  docs:quickstart-verify:
    desc: CI gate — assert the documented 3-command Quickstart appears in marketing.
    cmds:
      - grep -F 'npx create-platform@latest' apps/marketing/src/pages/quickstart.astro
      - grep -F 'task launch' apps/marketing/src/pages/quickstart.astro
      - grep -F 'task open' apps/marketing/src/pages/quickstart.astro
