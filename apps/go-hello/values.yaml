appName: go-hello
image:
  repository: ghcr.io/org/go-hello
  tag: ''
service:
  http: { port: 8080 }
  grpc: { port: 9000 }
  metrics: { port: 9090 }
observability:
  otel:
    enabled: true
    endpoint: otel-collector.observability:4317
  prometheus:
    scrape: true
secrets:
  esoStore: cluster-secret-store
  items:
    - { name: pg-dsn, key: go-hello/pg-dsn }
    - { name: redis-url, key: go-hello/redis-url }
    - { name: kafka-brokers, key: kafka/brokers }
networkPolicy:
  egressAllow: [postgres, redis, kafka, otel-collector]
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 500m, memory: 256Mi }
