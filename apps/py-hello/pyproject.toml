[project]
name = "py-hello"
version = "0.1.0"
description = "Reference Python 3.13 FastAPI service for the platform conformance suite"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "asyncpg>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "redis>=5.2",
  "aiokafka>=0.12",
  "opentelemetry-distro>=0.50b0",
  "opentelemetry-exporter-otlp>=1.29",
  "opentelemetry-instrumentation-fastapi>=0.50b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
  "opentelemetry-instrumentation-redis>=0.50b0",
  "opentelemetry-instrumentation-aiokafka>=0.50b0",
  "prometheus-client>=0.21",
  "contracts",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "testcontainers[postgres,redis,kafka]>=4.8",
  "ruff>=0.7",
  "mypy>=1.13",
]

[tool.uv.sources]
# Phase 3 ships the Python contracts wheel at packages/contracts-py with the
# package name "contracts". We consume it as an editable install so codegen
# updates are picked up without a publish step.
contracts = { path = "../../packages/contracts-py", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/py_hello"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.mypy]
python_version = "3.13"
strict = true
