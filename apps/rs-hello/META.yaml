apiVersion: ts-monorepo-template.dev/v1
kind: App
metadata:
  name: rs-hello
  language: rust
  framework: axum
spec:
  schema: platform.app/v1
  id: rs-hello
  languageVersion: '1.83'
  capabilities:
    - http-api
    - grpc-api
    - prometheus-metrics
    - otel-tracing
  needs:
    - kind: XPostgresCluster
      ref: { name: rs-hello-pg, env: '{{env}}' }
      size: small
      optional: false
    - kind: XRedisCluster
      ref: { name: rs-hello-redis, env: '{{env}}' }
      size: small
      optional: false
    - kind: XKafkaTopic
      topics: [user.created]
      optional: false
  exposes:
    services:
      - { name: rs-hello, port: 8080, protocol: http }
      - { name: rs-hello-grpc, port: 9000, protocol: grpc }
    metrics: { path: /metrics, port: 9090 }
    health: { path: /healthz, port: 8080 }
  contracts:
    - packages/contracts/proto/user/v1/user.proto
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 500m, memory: 128Mi }
  profiles:
    p-solo: { replicas: 1, hpa: false }
    p-hobby: { replicas: 1, hpa: false }
    p-startup-small: { replicas: 2, hpa: { min: 2, max: 5 } }
  costEstimate:
    minimal: 1usd/month
    typical: 4usd/month
