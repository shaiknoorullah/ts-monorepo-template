[workspace]
resolver = "2"
members = [
  "apps/rs-hello",
  # Phase 3 actually shipped the Rust contracts crate at packages/contracts-rs
  # (rs gen output lives under packages/contracts/gen/rs/src and is `include!`d
  # by packages/contracts-rs/src/lib.rs). The plan §4.1 text listed the gen
  # subdir; we use the actual crate path instead so cargo can resolve it.
  "packages/contracts-rs",
]

[workspace.package]
edition = "2021"
rust-version = "1.83"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-opentelemetry = "0.27"
opentelemetry = "0.26"
opentelemetry_sdk = { version = "0.26", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.26", features = ["grpc-tonic"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
redis = { version = "0.27", features = ["tokio-comp"] }
rdkafka = { version = "0.36", features = ["cmake-build"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.10", features = ["v4", "serde"] }
figment = { version = "0.10", features = ["env", "toml"] }
prometheus = "0.13"
tonic = "0.12"
prost = "0.13"
