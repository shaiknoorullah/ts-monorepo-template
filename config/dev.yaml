# config/dev.yaml — local developer laptop
#
# Layering: this file is merged ON TOP OF base.yaml via c12's `$extends`.
# Values here win over base. Tenant configs further override this.

$extends: ./base.yaml

app:
  env: dev
  port: 3000
  logLevel: debug

database:
  host: localhost
  user: dev
  password: dev # raw value — allowed in dev only
  database: app

redis:
  host: localhost
  port: 6379

kafka:
  bootstrapServers:
    - localhost:9092

observability:
  otel:
    enabled: true
    exporter: otlp-grpc
    endpoint: http://localhost:4317
    serviceName: app-dev

auth:
  issuer: http://localhost:8104/realms/master
  audience: app
  clientId: app

saas:
  keycloak:
    url: http://localhost:8104
    realm: master
  meilisearch:
    host: http://localhost:7700

mailer:
  host: localhost
  port: 1025
  secure: false
  fromAddress: dev@example.com
