# Lefthook — fast Go-based git hooks manager.
# https://lefthook.dev/configuration/
pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{ts,tsx,js,mjs,cjs}'
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    format:
      glob: '*.{ts,tsx,js,json,md,yml,yaml}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    types:
      glob: '*.{ts,tsx}'
      # `tsc -b --noEmit` is incompatible with composite project references
      # (TS6310: referenced projects can't disable emit). Use `tsc -b` so
      # composite projects emit their .d.ts as intended, and pre-existing
      # references continue to type-check.
      run: pnpm exec tsc -b

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    test-affected:
      run: pnpm exec nx affected -t test --base=origin/main --parallel=4
    knip:
      # Soft check — knip findings are tracked but not push-blocking; we have
      # a backlog of intentional unused exports (template stubs, public API
      # surface) that needs per-package curation. See knip.json TODOs.
      run: pnpm exec knip --no-progress --no-exit-code || true
