# Lefthook — fast Go-based git hooks manager.
# https://lefthook.dev/configuration/
pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{ts,tsx,js,mjs,cjs}"
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    format:
      glob: "*.{ts,tsx,js,json,md,yml,yaml}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    types:
      glob: "*.{ts,tsx}"
      run: pnpm exec tsc -b --noEmit

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    test-affected:
      run: pnpm exec nx affected -t test --base=origin/main --parallel=4
    knip:
      run: pnpm exec knip --no-progress
