# Chatwoot CE — customer engagement / support inbox (MIT — CE binary).
# Adapted from https://github.com/chatwoot/chatwoot/blob/develop/docker-compose.production.yaml
#
# Services:
#   chatwoot-rails    Web (Rails) — host :8106 → container :3000
#   chatwoot-sidekiq  Background jobs
#   chatwoot-postgres Dedicated Postgres (Chatwoot pins Postgres 12; sharing the
#                     app's PG 16 cluster is not supported).
#   chatwoot-redis    Dedicated Redis 7
#
# OIDC wiring (Keycloak):
#   Chatwoot CE does not ship a native OIDC connector — the Enterprise edition does.
#   For CE, front Chatwoot with oauth2-proxy + Keycloak. See:
#     https://github.com/oauth2-proxy/oauth2-proxy
#   Or use Chatwoot's SAML support if you wire a SAML IdP instead.
#
# Override port via .env.saas-commons: CHATWOOT_PORT=<port>
version: "3.9"

x-restart: &restart
  restart: unless-stopped

x-rails-env: &rails-env
  RAILS_ENV: production
  RAILS_LOG_TO_STDOUT: "true"
  NODE_ENV: production
  INSTALLATION_ENV: docker
  SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE:?CHATWOOT_SECRET_KEY_BASE is required (rails secret)}
  FRONTEND_URL: ${CHATWOOT_FRONTEND_URL:-http://localhost:8106}
  DEFAULT_LOCALE: en
  FORCE_SSL: "false"
  ENABLE_ACCOUNT_SIGNUP: ${CHATWOOT_ENABLE_ACCOUNT_SIGNUP:-false}
  REDIS_URL: redis://chatwoot-redis:6379
  POSTGRES_HOST: chatwoot-postgres
  POSTGRES_USERNAME: ${CHATWOOT_POSTGRES_USER:-chatwoot}
  POSTGRES_PASSWORD: ${CHATWOOT_POSTGRES_PASSWORD:-changeme}
  POSTGRES_DATABASE: ${CHATWOOT_POSTGRES_DB:-chatwoot_production}
  ACTIVE_STORAGE_SERVICE: local
  MAILER_SENDER_EMAIL: ${CHATWOOT_MAILER_SENDER_EMAIL:-Chatwoot <noreply@example.com>}
  SMTP_DOMAIN: ${CHATWOOT_SMTP_DOMAIN:-example.com}
  SMTP_ADDRESS: ${CHATWOOT_SMTP_ADDRESS:-}
  SMTP_PORT: ${CHATWOOT_SMTP_PORT:-587}
  SMTP_USERNAME: ${CHATWOOT_SMTP_USERNAME:-}
  SMTP_PASSWORD: ${CHATWOOT_SMTP_PASSWORD:-}

services:
  chatwoot-postgres:
    image: postgres:12-alpine
    container_name: chatwoot-postgres
    <<: *restart
    environment:
      POSTGRES_DB: ${CHATWOOT_POSTGRES_DB:-chatwoot_production}
      POSTGRES_USER: ${CHATWOOT_POSTGRES_USER:-chatwoot}
      POSTGRES_PASSWORD: ${CHATWOOT_POSTGRES_PASSWORD:-changeme}
    volumes:
      - chatwoot-postgres-data:/var/lib/postgresql/data
    networks: [saas-commons]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CHATWOOT_POSTGRES_USER:-chatwoot}"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "1", memory: 1G }

  chatwoot-redis:
    image: redis:7.4-alpine
    container_name: chatwoot-redis
    <<: *restart
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - chatwoot-redis-data:/data
    networks: [saas-commons]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  chatwoot-rails:
    image: chatwoot/chatwoot:v3.12.0
    container_name: chatwoot-rails
    <<: *restart
    depends_on:
      chatwoot-postgres: { condition: service_healthy }
      chatwoot-redis:    { condition: service_healthy }
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    environment: *rails-env
    volumes:
      - chatwoot-storage:/app/storage
    ports:
      - "${CHATWOOT_PORT:-8106}:3000"
    networks: [saas-commons, obs]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits: { cpus: "1", memory: 1500M }

  chatwoot-sidekiq:
    image: chatwoot/chatwoot:v3.12.0
    container_name: chatwoot-sidekiq
    <<: *restart
    depends_on:
      chatwoot-rails: { condition: service_healthy }
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    environment: *rails-env
    volumes:
      - chatwoot-storage:/app/storage
    networks: [saas-commons, obs]
    deploy:
      resources:
        limits: { cpus: "1", memory: 1G }

volumes:
  chatwoot-postgres-data:
  chatwoot-redis-data:
  chatwoot-storage:

networks:
  saas-commons:
    external: true
    name: saas-commons
  obs:
    external: true
    name: obs
