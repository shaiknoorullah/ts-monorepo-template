# docker/cms.compose.yml
# Local dev: Payload CMS 3 + Postgres + MinIO (R2 emulator).

services:
  cms-postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: payload
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
    volumes:
      - cms-pg:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'payload']
      interval: 5s
      timeout: 5s
      retries: 10

  cms-minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: payload
      MINIO_ROOT_PASSWORD: payload-minio
    ports:
      - '9100:9000'
      - '9101:9001'
    volumes:
      - cms-minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  cms-minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-22T17-08-11Z
    depends_on:
      cms-minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "
      mc alias set local http://cms-minio:9000 payload payload-minio &&
      mc mb -p local/cms-media || true &&
      mc anonymous set download local/cms-media
      "

  cms:
    build:
      context: ..
      dockerfile: apps/cms/Dockerfile
    restart: unless-stopped
    depends_on:
      cms-postgres:
        condition: service_healthy
      cms-minio-init:
        condition: service_completed_successfully
    environment:
      PAYLOAD_SECRET: dev-secret-change-me
      PAYLOAD_PUBLIC_SERVER_URL: http://localhost:3001
      DATABASE_URI: postgres://payload:payload@cms-postgres:5432/payload
      R2_BUCKET: cms-media
      R2_ENDPOINT: http://cms-minio:9000
      R2_ACCESS_KEY_ID: payload
      R2_SECRET_ACCESS_KEY: payload-minio
      CORS_ORIGINS: http://localhost:4321,http://localhost:8081
      CSRF_ORIGINS: http://localhost:4321,http://localhost:8081
    ports:
      - '3001:3000'

volumes:
  cms-pg:
  cms-minio:
