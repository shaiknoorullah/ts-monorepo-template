# Developer-laptop compose. Single instance of everything, ports exposed,
# hot reload via mounted source.
#
# Usage:
#   docker compose -f docker/compose.dev.yml up -d
#
# Add UIs:
#   docker compose -f docker/compose.dev.yml -f docker/compose.dev-tools.yml \
#     --profile tools up -d
name: tsm-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: app
    ports: ['5432:5432']
    volumes: [pg-dev:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dev']
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports: ['6379:6379']
    command: ['redis-server', '--save', '', '--appendonly', 'no']

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    ports:
      - '9092:9092'
      - '29092:29092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: 'tsm-dev-kraft-000'
    healthcheck:
      test: ['CMD', 'kafka-broker-api-versions', '--bootstrap-server', 'localhost:9092']
      interval: 15s
      retries: 10

  schema-registry:
    image: apicurio/apicurio-registry-mem:2.6.5.Final
    ports: ['8080:8080']
    depends_on:
      kafka: { condition: service_healthy }

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    command: ['--config=/etc/otelcol/config.yml']
    volumes:
      - ./observability/otel-collector-dev.yml:/etc/otelcol/config.yml:ro
    ports:
      - '4317:4317'
      - '4318:4318'

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: dev
    command: ['pnpm', '--filter', '@app/api', 'dev']
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://dev:dev@postgres:5432/app
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: api
    ports: ['3000:3000']
    volumes:
      - ../apps/api:/app/apps/api
      - ../packages:/app/packages
      - /app/node_modules
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

volumes:
  pg-dev:
